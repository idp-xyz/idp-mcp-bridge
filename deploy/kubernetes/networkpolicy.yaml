# Default deny, then exactly the flows needed. The bridge verifies the gateway's signature over the caller itself (ADR-0001
# D2) and the Workspace's token itself (B2, internal/api), but anything that can reach a port can try, so these policies are
# part of the boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: idp-mcp-bridge
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: idp-mcp-bridge
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# In, the MCP port: only the idp-mcp gateway, which makes the calls, and the idp-mcp registry, which discovers the tools
# (tools/list, and a connection test when a server is registered). The registry can list tools and cannot call one: a tools/call
# without the gateway's signature is refused (403) by the service itself.
# In, the API port: only the Workspace (the page of connected services and the OAuth callback, B2), which calls with the
# member's token exchanged for this audience; the gateway cannot reach it, nor the Workspace the MCP port.
# In, the ops port (/metrics): the observability namespace; the kubelet's probes are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-ingress
  namespace: idp-mcp-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bridge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/component: registry
      ports:
        - {protocol: TCP, port: 8680}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-workspace
          podSelector:
            matchLabels:
              app.kubernetes.io/component: workspace
      ports:
        - {protocol: TCP, port: 8681}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9680}
---
# Out: to public addresses on 443, which is the only port a connection's address may have (https). The service itself refuses
# every address the IANA special-purpose registries mark as not globally reachable (ADR-0001 D6, internal/addr, copied from
# idp-web); the excepts below are its IPv4 part, and tests/deploy compares the two over the whole IPv4 space. This is the same
# refusal made by the cluster, so that a bug or a misconfiguration of the service (or a DNS answer that slips through) does not
# open the cluster or the operator's network.
# If the cluster's pod, service or node addresses are not in the ranges excluded below, add them.
# IPv4 only: with no IPv6 rule the service reaches no IPv6 address (it then uses a host's IPv4 one).
# Nothing else leaves the pod: not the Kubernetes API, not another namespace, but for the two policies below (the database and
# Keycloak's keys).
# With a corporate egress proxy (IDP_BRIDGE_EGRESS_PROXY) this rule is replaced by one that admits the proxy and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-egress
  namespace: idp-mcp-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bridge
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3                  # multicast and 240.0.0.0/4, with 255.255.255.255
      ports:
        - {protocol: TCP, port: 443}
---
# Out, to the database of the grants: PostgreSQL in the databases namespace on 5432, and nothing else of the cluster. The
# public-address rule above excludes every private range, so the database needs a rule of its own; this one names the pods, not
# an address. Adjust the selectors to where your PostgreSQL runs (idp-mcp, idp-host and idp-web use the same). The migration Job
# has this rule and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-database
  namespace: idp-mcp-bridge
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [bridge, migrate]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
---
# Out, to Keycloak's keys (the JWKS the Workspace's calls are verified against, ADR-0001 D28): the pods of Keycloak, on its HTTPS
# port, and nothing else. Adjust the namespace, the labels and the port to where your Keycloak runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-keycloak
  namespace: idp-mcp-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bridge
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {protocol: TCP, port: 8443}
